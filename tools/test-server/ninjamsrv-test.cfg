# A local NINJAM server for testing JamTabaYUP with ninjam_cli.
# Run Cockos ninjamsrv (https://github.com/justinfrankel/ninjam, ninjam/server)
# from this folder:  ninjamsrv ninjamsrv-test.cfg
# No licence agreement, anonymous logins allowed, voting on, 4 s intervals.

Port 20490
MaxUsers 8
MaxChannels 4 4
AnonymousUsers yes
AnonymousUsersCanChat yes
AnonymousMaskIP no
AllowHiddenUsers no
SetVotingThreshold 50
SetVotingVoteTimeout 60
ACL 0.0.0.0/0 allow
DefaultTopic "JamTabaYUP test server"
DefaultBPM 120
DefaultBPI 8
